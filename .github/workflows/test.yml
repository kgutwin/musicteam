name: Test

on:
  push:

jobs:
  precommit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: musicteam-nuxt/package-lock.json

      - name: npm install
        run: "cd musicteam-nuxt && npm install"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .pre-commit-config.yaml
            requirements-dev.txt
            musicteam/requirements.txt

      - name: Cache pre-commit hooks
        uses: actions/cache@v5
        with:
          key: "pre-commit|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}"
          path: ~/.cache/pre-commit

      - name: Run pre-commit
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python -m pip install -r requirements-dev.txt -r musicteam/requirements.txt
          pre-commit run --all-files --show-diff-on-failure

  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            musicteam/requirements.txt
            musicteam/requirements-semantic.txt

      - name: Install requirements
        run: |
          python -m pip install -r requirements-dev.txt -r musicteam/requirements.txt -r musicteam/requirements-semantic.txt

      - name: Run pytest
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: |
          cd musicteam
          pytest -vv

  cy-component-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: musicteam-nuxt/package-lock.json

      - name: Run Cypress Component test
        uses: cypress-io/github-action@v7
        with:
          component: true
          working-directory: musicteam-nuxt

      - name: Record Cypress Component test run
        if: failure()
        uses: cypress-io/github-action@v7
        with:
          component: true
          working-directory: musicteam-nuxt
          record: true
          tag: component
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

  build-and-e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: musicteam-nuxt/package-lock.json

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: musicteam

      - name: Start Docker
        run: docker run -d --rm --name mt -p 3000:3000 -p 9000:9000 musicteam && docker logs --follow mt &> /tmp/server-log.txt

      - name: Run Cypress
        id: cypress
        uses: cypress-io/github-action@v7
        with:
          working-directory: musicteam-nuxt
          wait-on: http://localhost:3000/api/

      - name: Save server log as artifact
        if: failure() && steps.cypress.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          path: /tmp/server-log.txt
          archive: false

      # - name: Record Cypress run if necessary
