default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: '^musicteam-nuxt/public/pdfjs|\.ambr$'
      - id: end-of-file-fixer
        exclude: '^musicteam-nuxt/public/pdfjs|\.ambr$'
      - id: check-ast

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        entry: bash -c "MYPYPATH=musicteam/mypy-stubs mypy $@" --
        args: ["--strict"]
        exclude: "musicteam/tests/"
        additional_dependencies:
          - "aurora-data-api"
          - "pydantic>2"
          - "requests-oauthlib"
          - "google-auth"
          - "pyjwt"
          - "chalice"
          - "psycopg"
          - "types-psutil"
          - "types-requests-oauthlib"
          - "apispec"
          - "apispec-pydantic-plugin"
          - "boto3-stubs"
          - "pymupdf-stubs==1.26.1-post1"

  - repo: https://github.com/wimglenn/reorder-python-imports-black
    rev: v3.14.0
    hooks:
      - id: reorder-python-imports

  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: local
    hooks:
      - id: generate-apispec
        name: generate api spec
        language: system
        entry: bash -c 'cd musicteam; python generate_apispec.py ../musicteam-api.yaml'
        pass_filenames: false
        files: "musicteam/app.py|musicteam/chalicelib"
        types: [file]

      - id: generate-nuxt-api
        name: generate nuxt api
        language: system
        entry: bash -c 'cd musicteam-nuxt; npm run generate-api'
        pass_filenames: false
        files: "musicteam/app.py|musicteam/chalicelib|musicteam-api.yaml"
        types: [file]

      - id: check-page-title
        name: all pages must have titles
        language: pygrep
        entry: "<Title"
        args: [--negate]
        files: "musicteam-nuxt/app/pages"
        types: [file]

      - id: typecheck
        name: nuxt typecheck
        language: system
        entry: bash -c 'cd musicteam-nuxt; npm run lint:tsc'
        pass_filenames: false
        files: "musicteam-nuxt/app"
        types: [file]

      - id: typecheck-cy
        name: cypress typecheck
        language: system
        entry: bash -c 'cd musicteam-nuxt; npm run cy:tsc'
        pass_filenames: false
        files: 'musicteam-nuxt/cypress/(.*)\.ts'
        types: [file]
