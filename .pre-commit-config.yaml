default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^musicteam-nuxt/public/pdfjs|\.ambr$'
      - id: end-of-file-fixer
        exclude: '^musicteam-nuxt/public/pdfjs|\.ambr$'
      - id: check-ast

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        entry: bash -c "MYPYPATH=musicteam/mypy-stubs mypy $@" --
        args: ["--strict"]
        exclude: "musicteam/tests/"
        additional_dependencies:
          - "aurora-data-api==0.5.0"
          - "pydantic==2.13.3"
          - "requests-oauthlib==2.0.0"
          - "google-auth==2.49.1"
          - "PyJWT==2.12.1"
          - "chalice==1.32.0"
          - "psycopg==3.3.3"
          - "types-psutil==7.2.2.20260408"
          - "types-requests-oauthlib==2.0.0.20260408"
          - "types-PyYAML==6.0.12.20260408"
          - "apispec==6.10.0"
          - "apispec-pydantic-plugin==0.8.2"
          - "boto3-stubs==1.42.96"
          - "pymupdf-stubs==1.27.2.2.post2"

  - repo: https://github.com/wimglenn/reorder-python-imports-black
    rev: v3.14.0
    hooks:
      - id: reorder-python-imports

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix"]

  - repo: https://github.com/kgutwin/pre-commit-mypy-sync
    rev: 7729bdec2390b36e3c570f4a54f98166419a7901
    hooks:
      - id: mypy-requirements-sync
        args:
          - "--no-install"
          - "-r"
          - "requirements-dev.txt"
          - "-r"
          - "musicteam/requirements.txt"
          - "--in-place"
        files: "requirements-dev.txt|musicteam/requirements.txt"

  - repo: local
    hooks:
      - id: generate-apispec
        name: generate api spec
        language: system
        entry: bash -c 'cd musicteam; python generate_apispec.py ../musicteam-api.yaml'
        pass_filenames: false
        files: "musicteam/app.py|musicteam/chalicelib"
        types: [file]

      - id: generate-nuxt-api
        name: generate nuxt api
        language: system
        entry: bash -c 'cd musicteam-nuxt; npm run generate-api'
        pass_filenames: false
        files: "musicteam/app.py|musicteam/chalicelib|musicteam-api.yaml"
        types: [file]

      - id: check-page-title
        name: all pages must have titles
        language: pygrep
        entry: "<Title"
        args: [--negate]
        files: "musicteam-nuxt/app/pages"
        types: [file]

      - id: typecheck
        name: nuxt typecheck
        language: system
        entry: bash -c 'cd musicteam-nuxt; npm run lint:tsc'
        pass_filenames: false
        files: "musicteam-nuxt/app|musicteam-nuxt/package"
        types: [file]

      - id: typecheck-cy
        name: cypress typecheck
        language: system
        entry: bash -c 'cd musicteam-nuxt; npm run cy:tsc'
        pass_filenames: false
        files: 'musicteam-nuxt/cypress/(.*)\.ts'
        types: [file]

ci:
  skip:
    - generate-apispec
    - generate-nuxt-api
    - typecheck
    - typecheck-cy
